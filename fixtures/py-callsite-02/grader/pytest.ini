# The grader owns its own pytest configuration.
#
# It must never inherit the subject tree's pytest.ini: that file is inside the
# tree the model edits, so `addopts`, `python_files` and `pythonpath` would all
# be model-controlled at grading time. Reproduced in round 1 of the review
# gauntlet on fixture #1 - `addopts = -x` truncated a grading run and turned
# earned failures into discards.
[pytest]
python_files = test_*.py
