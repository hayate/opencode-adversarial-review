[project]
name = "opencode-deepseek-review"
version = "0.1.0"
description = "Differential eval harness and the opencode review plugin it generates"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-json-report>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["harness*", "graders*", "analysis*"]
